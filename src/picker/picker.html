<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Partilhar Ecrã</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="dark"] {
      --bg: #212124;
      --surface: #18181b;
      --surface-raised: #2a2a2e;
      --border: #2e2e32;
      --border-strong: #3f3f46;
      --text: #e8e8ea;
      --text-muted: #71717a;
      --text-dim: #a1a1aa;
      --label: #d4d4d8;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --accent-soft: #0c2d3f;
      --btn-secondary: #3f3f46;
      --btn-secondary-hover: #52525b;
    }

    [data-theme="light"] {
      --bg: #f7f6fb;
      --surface: #ffffff;
      --surface-raised: #f1eff8;
      --border: rgba(96,84,140,.14);
      --border-strong: rgba(96,84,140,.22);
      --text: #1b1a22;
      --text-muted: #6a6678;
      --text-dim: #9a96a8;
      --label: #52525b;
      --accent: #6d5ae6;
      --accent-hover: #5b46d8;
      --accent-soft: rgba(109,90,230,.12);
      --btn-secondary: rgba(212,212,216,0.8);
      --btn-secondary-hover: rgba(212,212,216,1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    header {
      -webkit-app-region: drag;
      background: var(--surface);
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      -webkit-app-region: no-drag;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface-raised);
      border: 2px solid var(--border-strong);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: var(--text-dim);
    }

    .card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card img:first-child {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
    }

    .app-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .card-label {
      font-size: 12px;
      color: var(--label);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #audio-row {
      display: none;
      align-items: center;
      gap: 6px;
      flex: 1;
      color: var(--text-dim);
      font-size: 12px;
    }

    #audio-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    #audio-row label { cursor: pointer; }

    .spacer { flex: 1; }

    button {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #btn-cancel {
      background: var(--btn-secondary);
      color: var(--label);
    }

    #btn-cancel:hover { background: var(--btn-secondary-hover); }

    #btn-share {
      background: var(--accent);
      color: #fff;
    }

    #btn-share:hover:not(:disabled) { background: var(--accent-hover); }

    #btn-share:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Escolher o que partilhar</h1>
  </header>

  <div class="content">
    <div id="screens-group">
      <p class="section-label">Ecrãs</p>
      <div class="grid" id="screens-list"></div>
    </div>
    <div id="windows-group">
      <p class="section-label">Janelas</p>
      <div class="grid" id="windows-list"></div>
    </div>
  </div>

  <footer>
    <div id="audio-row">
      <input type="checkbox" id="audio-checkbox">
      <label for="audio-checkbox">Partilhar áudio do sistema</label>
    </div>
    <div class="spacer"></div>
    <button id="btn-cancel">Cancelar</button>
    <button id="btn-share" disabled>Partilhar</button>
  </footer>

  <script src="picker.js"></script>
</body>
</html>
