<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Partilhar Ecrã</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #212124;
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* Barra de título arrastável */
    header {
      -webkit-app-region: drag;
      background: #18181b;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #2e2e32;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f4f4f5;
      -webkit-app-region: no-drag;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: #3f3f46 transparent;
    }

    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: #2a2a2e;
      border: 2px solid #3f3f46;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: #52525b;
      background: #2f2f34;
    }

    .card.selected {
      border-color: #0ea5e9;
      background: #0c2d3f;
    }

    .card img:first-child {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #18181b;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
    }

    .app-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .card-label {
      font-size: 12px;
      color: #d4d4d8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    footer {
      background: #18181b;
      border-top: 1px solid #2e2e32;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #audio-row {
      display: none;
      align-items: center;
      gap: 6px;
      flex: 1;
      color: #a1a1aa;
      font-size: 12px;
    }

    #audio-row input[type="checkbox"] {
      accent-color: #0ea5e9;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    #audio-row label { cursor: pointer; }

    .spacer { flex: 1; }

    button {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #btn-cancel {
      background: #3f3f46;
      color: #d4d4d8;
    }

    #btn-cancel:hover { background: #52525b; }

    #btn-share {
      background: #0ea5e9;
      color: #fff;
    }

    #btn-share:hover:not(:disabled) { background: #0284c7; }

    #btn-share:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Escolher o que partilhar</h1>
  </header>

  <div class="content">
    <div id="screens-group">
      <p class="section-label">Ecrãs</p>
      <div class="grid" id="screens-list"></div>
    </div>
    <div id="windows-group">
      <p class="section-label">Janelas</p>
      <div class="grid" id="windows-list"></div>
    </div>
  </div>

  <footer>
    <div id="audio-row">
      <input type="checkbox" id="audio-checkbox">
      <label for="audio-checkbox">Partilhar áudio do sistema</label>
    </div>
    <div class="spacer"></div>
    <button id="btn-cancel">Cancelar</button>
    <button id="btn-share" disabled>Partilhar</button>
  </footer>

  <script src="picker.js"></script>
</body>
</html>
